name: macOS build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/ToggleTask

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: |
          APP="$RUNNER_TEMP/ToggleTask.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/ToggleTask "$APP/Contents/MacOS/ToggleTask"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/ToggleTask"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/ToggleTask-macos.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToggleTask-macos
          path: ${{ runner.temp }}/ToggleTask-macos.zip

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser prototype
        run: test -s prototype/index.html

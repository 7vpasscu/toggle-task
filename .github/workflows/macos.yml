name: macOS build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/ToggleTask

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve package
        run: swift package resolve

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Assemble app bundle
        run: |
          APP="$RUNNER_TEMP/Task Track.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/ToggleTask "$APP/Contents/MacOS/ToggleTask"
          cp Sources/ToggleTask/Resources/task-track-csv.js "$APP/Contents/Resources/"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/ToggleTask"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/ToggleTask"
          test -s "$APP/Contents/Resources/task-track-csv.js"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/TaskTrack-macos.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskTrack-macos
          path: ${{ runner.temp }}/TaskTrack-macos.zip

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser prototype
        run: node --test prototype/core.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix prototype
      - run: npx playwright install --with-deps chromium
        working-directory: prototype
      - run: npx playwright test --config playwright.config.cjs
        working-directory: prototype

name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build Windows app
        run: dotnet build windows/ToggleTask/ToggleTask.csproj --configuration Release
      - name: Test ownership and activity ledger
        run: dotnet run --project windows/ToggleTask.Tests/ToggleTask.Tests.csproj
      - name: Publish Windows app
        run: dotnet publish windows/ToggleTask/ToggleTask.csproj --configuration Release -r win-x64 --self-contained true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: TaskTrack-windows
          path: dist/windows

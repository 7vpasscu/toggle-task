<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toggle Task — macOS prototype</title><style>:root{font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#101828;color:#d0d5dd;padding:24px 18px}.brand{font-size:21px;font-weight:700;color:white;margin:4px 8px 32px}.nav{padding:11px 10px;border-radius:8px;margin:5px 0;color:#fff}.nav.active{background:#27344a}.main{max-width:960px;width:100%;padding:34px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:26px;margin:0}.status{color:#667085;font-size:12px}.timer{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:20px;margin:24px 0;box-shadow:0 8px 24px #1018280b}.desc{width:100%;border:0;outline:0;font-size:18px;padding:4px 0 18px}.row{display:flex;gap:16px;align-items:center}.select{flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.clock{font:26px ui-monospace,monospace}.button{border:0;border-radius:8px;padding:11px 20px;background:#2f80ed;color:white;font-weight:600;cursor:pointer}.button.running{background:#d92d20}.section{font-weight:700;margin:16px 0 8px}.session{background:#fff;border-bottom:1px solid #eaecf0;padding:14px 10px;display:flex;justify-content:space-between}.muted{color:#667085;font-size:12px;margin-top:4px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.row{flex-wrap:wrap}.select{min-width:100%}}</style></head><body><div class="app"><aside class="side"><div class="brand">Toggle Task</div><div class="nav active">◷ &nbsp; Timer</div><div class="nav">☷ &nbsp; Actividad</div><div class="muted" style="margin:32px 10px">PERSONAL SPACE</div></aside><main class="main"><div class="top"><h1>Hoy</h1><span class="status" id="sync">Datos simulados</span></div><section class="timer"><input class="desc" id="description" placeholder="¿En qué estás trabajando?"><div class="row"><select class="select" id="project"><option>Carolina Herrera — Good Girl</option><option>Rabanne — Christmas 2026</option><option>L’Artisan Parfumeur — Gifting</option></select><span class="clock" id="clock">00:00:00</span><button class="button" id="toggle">Iniciar</button></div></section><div class="section">Sesiones recientes</div><div id="sessions"><div class="session"><div>Dirección de arte y revisión de visuales<div class="muted">Carolina Herrera — Good Girl</div></div><span>00:30:00</span></div></div></main></div><script>let running=false,start=0,elapsed=0,interval;const clock=document.querySelector('#clock'),button=document.querySelector('#toggle'),sessions=document.querySelector('#sessions');function fmt(s){return new Date(s*1000).toISOString().slice(11,19)}function render(){clock.textContent=fmt(elapsed)}button.onclick=()=>{if(!running){running=true;start=Date.now()-elapsed*1000;button.textContent='Parar';button.classList.add('running');interval=setInterval(()=>{elapsed=Math.floor((Date.now()-start)/1000);render()},250)}else{running=false;clearInterval(interval);const project=document.querySelector('#project').value;const desc=document.querySelector('#description').value||'Sin descripción';const row=document.createElement('div');row.className='session';row.innerHTML=`<div>${desc}<div class="muted">${project}</div></div><span>${fmt(elapsed)}</span>`;sessions.prepend(row);button.textContent='Iniciar';button.classList.remove('running');document.querySelector('#sync').textContent='Pendiente de sincronizar';elapsed=0;render()}};</script></body></html>
